minimum_pre_commit_version: '4.7.0'
default_install_hook_types: [pre-commit, pre-merge-commit]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude --
        language: unsupported
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check --force-exclude --
        language: unsupported
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ty-check
        name: ty check
        entry: uv run --locked --all-packages ty check
        language: unsupported
        files: '(\.pyi?$|(^|/)pyproject\.toml$|^(ty\.toml|uv\.lock|\.python-version)$)'
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --locked --all-packages pytest
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit]
