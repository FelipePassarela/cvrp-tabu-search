[project]
name = "cvrp-tabu-search"
version = "0.1.0"
description = "Tabu search experiments for the Capacitated Vehicle Routing Problem (CVRP)"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/calibration", "packages/core", "packages/search"]

[tool.ruff]
src = ["packages/*/src"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ty.environment]
python = ".venv"

[tool.importlinter]
root_packages = ["cvrp_calibration", "cvrp_core", "cvrp_search"]

[[tool.importlinter.contracts]]
name = "CVRP core is independent of the applications"
type = "forbidden"
source_modules = ["cvrp_core"]
forbidden_modules = ["cvrp_calibration", "cvrp_search"]

[[tool.importlinter.contracts]]
name = "CVRP calibration and search applications are independent"
type = "independence"
modules = ["cvrp_calibration", "cvrp_search"]

[tool.pytest.ini_options]
testpaths = ["packages/calibration/tests", "packages/core/tests", "packages/search/tests"]
